<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seite nicht gefunden (404) | Niclas Koch</title>
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#06060A">
<link rel="icon" href="/favicon.ico" sizes="any">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: #06060A;
    color: #F3EFE6;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px;
    text-align: center;
  }
  .wrap { max-width: 520px; }
  .code {
    font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 14px;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: #FFE500;
    margin: 0 0 18px;
  }
  h1 { font-size: clamp(28px, 6vw, 44px); line-height: 1.15; margin: 0 0 16px; }
  p { font-size: 16px; line-height: 1.6; opacity: .8; margin: 0 0 28px; }
  .actions { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
  a.btn {
    display: inline-block;
    padding: 12px 20px;
    border-radius: 12px;
    text-decoration: none;
    font-weight: 600;
    font-size: 15px;
  }
  a.primary { background: #FFE500; color: #06060A; }
  a.ghost { border: 1px solid rgba(255,255,255,0.22); color: #F3EFE6; }
</style>
</head>
<body>
  <main class="wrap">
    <p class="code">Fehler 404</p>
    <h1>Diese Seite gibt es nicht (mehr).</h1>
    <p>Der Link ist vielleicht veraltet oder hat sich vertippt. Von hier kommst du weiter:</p>
    <div class="actions">
      <a class="btn primary" href="/">Zur Startseite</a>
      <a class="btn ghost" href="/blog/" hidden>Zum Blog</a>
      <a class="btn ghost" href="/#footer-area">Kontakt</a>
    </div>
  </main>
</body>
</html>
